name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check versions and shell syntax
        run: |
          npm run verify:version
          for script in deploy/scripts/*.sh; do bash -n "$script" || exit 1; done
      - name: Type and syntax checks
        run: |
          npm run build -w @gach/shared
          npm run lint --workspaces --if-present
      - name: Unit tests
        run: npm run test:unit -w @gach/api
      - name: API integration tests
        run: npm run test:e2e
      - name: Audit production dependencies
        run: npm audit --audit=true --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - name: Build and smoke test API and Web
        run: npm run verify:build

  dependency-review:
    name: Review dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0-only, AGPL-3.0-or-later
