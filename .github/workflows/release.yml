name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Attest and publish source release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: source-release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      ARCHIVE: GitHub-Achievement-Hub-${{ github.ref_name }}-Source.tar.gz
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Validate tag and assemble source archive
        run: |
          node scripts/verify-version.mjs "$GITHUB_REF_NAME"
          commit="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$commit" origin/main
          [ -z "$(git status --porcelain)" ]
          mkdir -p release
          git archive --prefix="GitHub-Achievement-Hub-$GITHUB_REF_NAME/" --format=tar "$commit" | gzip -n > "release/$ARCHIVE"
          sha="$(sha256sum "release/$ARCHIVE" | cut -d' ' -f1)"
          jq -n --arg tag "$GITHUB_REF_NAME" --arg commit "$commit" \
            --arg artifact "$ARCHIVE" --arg sha "$sha" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$ARCHIVE" \
            --argjson bytes "$(stat -c '%s' "release/$ARCHIVE")" \
            '{schemaVersion: 1, tag: $tag, commit: $commit, channel: "stable", type: "source", artifact: {name: $artifact, size: $bytes, sha256: $sha, url: $url}, runtime: {node: "24", database: "PGlite (development) or PostgreSQL"}}' \
            > release/release.json
          (cd release && sha256sum "$ARCHIVE" release.json > SHA256SUMS.txt)
          awk -v heading="## $GITHUB_REF_NAME · " '
            index($0, heading) == 1 { found=1; next }
            found && /^## / { exit }
            found { print }
          ' docs/releases/release-notes.md > "$RUNNER_TEMP/release-notes.md"
      - name: Sign archive and version metadata provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: release/SHA256SUMS.txt
      - name: Upload draft and verify downloadable assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::The release already exists. Inspect its state before retrying."
            exit 1
          fi
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [[ "$latest" == "$GITHUB_REF_NAME" || "$(printf '%s\n' "$latest" "$GITHUB_REF_NAME" | sort -V | tail -1)" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::A stable release must advance the version after $latest."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --draft \
            --title "GitHub Achievement Hub $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release download "$GITHUB_REF_NAME" --pattern '*' --dir download
          cmp release/SHA256SUMS.txt download/SHA256SUMS.txt
          (cd download && sha256sum -c SHA256SUMS.txt)
          for file in "$ARCHIVE" release.json; do
            gh attestation verify "download/$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
      - name: Publish verified release and check public URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          for file in "$ARCHIVE" release.json SHA256SUMS.txt; do
            curl -fsSL --retry 5 --retry-all-errors --max-time 90 \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$file" \
              -o "$RUNNER_TEMP/public-$file"
            cmp "release/$file" "$RUNNER_TEMP/public-$file"
          done
