[package]
name = "github-achievement-hub"
version = "1.0.0"
description = "GitHub Achievement Hub — 桌面端外壳 (Tauri v2)"
authors = ["GitHub Achievement Hub"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
default-run = "github-achievement-hub"

# 库名供 main.rs 调用；同时导出 rlib/cdylib 以便未来复用（如移动端 Tauri 方案）
[lib]
name = "gach_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-store = "2"
tauri-plugin-http = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# tauri-cli 通过该 feature 注入自定义协议（生产构建默认开启）
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
